<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="titulo">
  <title id="titulo">alfred — um cloche de mordomo com o prompt do terminal</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A4A"/>
      <stop offset="1" stop-color="#0E1628"/>
    </linearGradient>
    <linearGradient id="prata" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F6FA"/>
      <stop offset="0.55" stop-color="#C9CFDA"/>
      <stop offset="1" stop-color="#8E97A8"/>
    </linearGradient>
    <linearGradient id="bandeja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3E7EE"/>
      <stop offset="1" stop-color="#9AA3B3"/>
    </linearGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2C46B"/>
      <stop offset="1" stop-color="#C98A2B"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#fundo)"/>

  <!-- cúpula (cloche) -->
  <rect x="244" y="118" width="24" height="26" rx="6" fill="#B7BECB"/>
  <circle cx="256" cy="112" r="20" fill="url(#prata)"/>
  <path d="M110 330 C110 222 176 146 256 146 C336 146 402 222 402 330 Z" fill="url(#prata)"/>
  <!-- brilho -->
  <path d="M150 300 C152 236 188 190 238 174" fill="none" stroke="#FFFFFF" stroke-opacity="0.75"
        stroke-width="14" stroke-linecap="round"/>

  <!-- o prompt >_ gravado na cúpula -->
  <path d="M214 230 L262 262 L214 294" fill="none" stroke="#1B2A4A" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="276" y="282" width="56" height="18" rx="9" fill="#1B2A4A"/>

  <!-- bandeja -->
  <rect x="82" y="326" width="348" height="30" rx="15" fill="url(#bandeja)"/>

  <!-- gravata-borboleta -->
  <path d="M256 412 L176 376 C164 371 156 378 156 390 L156 434 C156 446 164 453 176 448 Z" fill="url(#ouro)"/>
  <path d="M256 412 L336 376 C348 371 356 378 356 390 L356 434 C356 446 348 453 336 448 Z" fill="url(#ouro)"/>
  <rect x="236" y="390" width="40" height="44" rx="12" fill="#E2A947" stroke="#0E1628" stroke-width="6"/>
</svg>
